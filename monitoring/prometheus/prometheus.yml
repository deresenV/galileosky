global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'galileosky_listener'
    static_configs:
      - targets: ['listener:8000']

remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
