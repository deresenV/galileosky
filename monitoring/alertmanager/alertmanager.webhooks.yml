global:
  resolve_timeout: 5m

route:
  receiver: extend-asics
  group_by: [alertname, container_id]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: extend-asics
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
        max_alerts: 0
        timeout: 10s
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook_token
